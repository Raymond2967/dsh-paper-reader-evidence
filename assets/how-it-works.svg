<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="How a PDF answer becomes a traceable citation: PDF text, OCR and tables/figures become an evidence index; the model calls search_pdf_evidence and writes a citation URL; the reader jumps to the page, draws the box, and records the verification trail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f5"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 21px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 400 12.5px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
      .h { font: 700 14px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .t { font: 400 11.5px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .s { font: 700 10px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f766e; letter-spacing: .7px; }
      .m { font: 600 11.5px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; fill: #0f172a; }
      .p { font: 600 10.5px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <text class="title" x="35" y="38">How a citation is made</text>
  <text class="sub" x="35" y="59">Every step keeps a page, source text, and a box you can verify.</text>

  <!-- 1. PDF sources -->
  <g filter="url(#shadow)">
    <rect x="35" y="78" width="204" height="222" rx="13" fill="url(#paper)" stroke="#e2e8f0"/>
    <text class="s" x="54" y="101">01 · PDF</text>
    <rect x="54" y="116" width="56" height="76" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="62" y="127" width="40" height="4" rx="2" fill="#94a3b8" opacity=".5"/>
    <rect x="62" y="137" width="32" height="4" rx="2" fill="#94a3b8" opacity=".4"/>
    <rect x="62" y="153" width="40" height="18" rx="2" fill="#ffe4e6" stroke="#fb7185"/>
    <text class="h" x="126" y="131">Sources</text>
    <text class="t" x="126" y="150">text layer</text>
    <text class="t" x="126" y="168">OCR labels</text>
    <text class="t" x="126" y="186">tables / figures</text>
    <text class="p" x="54" y="224">→ line or object</text>
    <text class="p" x="54" y="242">→ page + position</text>
    <text class="p" x="54" y="260">No upload to a server.</text>
    <text class="p" x="54" y="282">Local text + OCR</text>
  </g>

  <path d="M242 188H270" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M264 182L272 188L264 194" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Evidence index -->
  <g filter="url(#shadow)">
    <rect x="274" y="78" width="204" height="222" rx="13" fill="#ffffff" stroke="#99f6e4"/>
    <text class="s" x="293" y="101">02 · INDEX</text>
    <rect x="293" y="116" width="166" height="72" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <text class="m" x="306" y="139">p14 · table3</text>
    <text class="p" x="306" y="158">id · page</text>
    <text class="p" x="306" y="174">text · bbox</text>
    <text class="h" x="293" y="211">Evidence record</text>
    <text class="t" x="293" y="230">one per line or object</text>
    <text class="t" x="293" y="248">stable evidence id</text>
    <text class="t" x="293" y="266">normalized position</text>
    <text class="p" x="293" y="287">not a page guess</text>
  </g>

  <path d="M481 188H509" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M503 182L511 188L503 194" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Model + tool -->
  <g filter="url(#shadow)">
    <rect x="513" y="78" width="204" height="222" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="s" x="532" y="101">03 · MODEL</text>
    <rect x="532" y="116" width="166" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="p" x="544" y="136">“What does Table 3 show?”</text>
    <text class="p" x="544" y="152">→ tool call</text>
    <rect x="541" y="173" width="148" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="m" x="551" y="192">search_pdf_evidence</text>
    <text class="h" x="532" y="224">Retrieves evidence</text>
    <text class="t" x="532" y="243">query matches lines,</text>
    <text class="t" x="532" y="260">OCR labels, or objects</text>
    <text class="t" x="532" y="277">gets text + URL</text>
    <text class="p" x="532" y="295">model picks evidence</text>
  </g>

  <path d="M720 188H748" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M742 182L750 188L742 194" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4. Citation -->
  <g filter="url(#shadow)">
    <rect x="752" y="78" width="204" height="222" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="s" x="771" y="101">04 · CITATION</text>
    <rect x="771" y="116" width="166" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="h" x="785" y="141">Table 3</text>
    <text class="t" x="785" y="159">p14 · 2.50× · Drop</text>
    <text class="m" x="785" y="176">page=14</text>
    <text class="m" x="785" y="189">ev=p14:table3</text>
    <text class="h" x="771" y="216">A link, not a page</text>
    <text class="t" x="771" y="235">model copies the URL</text>
    <text class="t" x="771" y="252">from the tool result</text>
    <text class="t" x="771" y="269">page + evidence id</text>
    <text class="p" x="771" y="290">click to verify</text>
  </g>

  <path d="M959 188H987" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M981 182L989 188L981 194" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5. Reader -->
  <g filter="url(#shadow)">
    <rect x="991" y="78" width="174" height="222" rx="13" fill="url(#paper)" stroke="#e2e8f0"/>
    <text class="s" x="1010" y="101">05 · READER</text>
    <rect x="1010" y="116" width="72" height="98" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="1018" y="128" width="56" height="4" rx="2" fill="#94a3b8" opacity=".45"/>
    <rect x="1018" y="138" width="40" height="4" rx="2" fill="#94a3b8" opacity=".35"/>
    <rect x="1018" y="158" width="56" height="26" rx="2" fill="#fee2e2" stroke="#e11d48" stroke-width="2"/>
    <rect x="1023" y="166" width="28" height="3" rx="1.5" fill="#e11d48" opacity=".7"/>
    <text class="h" x="1094" y="136">Jump</text>
    <text class="t" x="1094" y="153">to the page</text>
    <text class="h" x="1094" y="176">Box</text>
    <text class="t" x="1094" y="193">the source</text>
    <text class="h" x="1010" y="238">Verification</text>
    <text class="t" x="1010" y="256">pages · queries</text>
    <text class="t" x="1010" y="273">evidence · citations</text>
    <text class="p" x="1010" y="291">recorded from tool calls</text>
  </g>

  <!-- bottom legend -->
  <rect x="35" y="323" width="1130" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="p" x="53" y="350">model chooses evidence</text>
  <path d="M230 342H270" stroke="#94a3b8" stroke-width="1.5"/><path d="M264 338L270 342L264 346" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="p" x="286" y="350">plugin resolves page + box</text>
  <path d="M500 342H540" stroke="#94a3b8" stroke-width="1.5"/><path d="M534 338L540 342L534 346" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="p" x="556" y="350">reader draws + records</text>
  <text class="p" x="820" y="350">no coordinate guessing by the model</text>
</svg>

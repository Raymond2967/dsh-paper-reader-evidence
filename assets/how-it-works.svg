<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="How evidence citations work: PDF, evidence index, answer citation, reader box">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .h { font: 700 16px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .t { font: 400 12.5px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .s { font: 600 11px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f766e; letter-spacing: .4px; }
      .m { font: 600 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; fill: #0f172a; }
      .tiny { font: 500 11px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#f8fafc"/>
  <path d="M0 1H1200M0 299H1200" stroke="#e2e8f0"/>

  <g filter="url(#s)">
    <rect x="36" y="58" width="226" height="166" rx="14" fill="url(#paper)" stroke="#e2e8f0"/>
    <rect x="56" y="80" width="72" height="94" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="66" y="92" width="52" height="5" rx="2.5" fill="#94a3b8" opacity=".55"/>
    <rect x="66" y="104" width="40" height="5" rx="2.5" fill="#94a3b8" opacity=".4"/>
    <rect x="66" y="122" width="52" height="26" rx="3" fill="#ffe4e6" stroke="#fb7185"/>
    <rect x="72" y="130" width="28" height="4" rx="2" fill="#e11d48" opacity=".7"/>
    <text class="h" x="148" y="96">PDF</text>
    <text class="t" x="148" y="118">text layer</text>
    <text class="t" x="148" y="136">OCR labels</text>
    <text class="t" x="148" y="154">tables / figures</text>
    <text class="s" x="56" y="205">01 · SOURCES</text>
  </g>

  <path d="M272 141H302" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M296 135L304 141L296 147" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#s)">
    <rect x="312" y="58" width="248" height="166" rx="14" fill="#ffffff" stroke="#99f6e4"/>
    <rect x="332" y="80" width="208" height="82" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
    <text class="s" x="348" y="102">EVIDENCE</text>
    <text class="m" x="348" y="124">p14 · table3</text>
    <text class="tiny" x="348" y="144">page + text + box</text>
    <text class="h" x="332" y="190">Evidence index</text>
    <text class="s" x="332" y="210">02 · GROUND TRUTH</text>
  </g>

  <path d="M570 141H600" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M594 135L602 141L594 147" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#s)">
    <rect x="610" y="58" width="238" height="166" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="632" y="82" width="194" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="h" x="650" y="108">Table 3</text>
    <text class="t" x="650" y="128">p.14 · 2.50× · Drop</text>
    <path d="M650 136H808" stroke="#cbd5e1"/>
    <text class="tiny" x="650" y="148">page=14&amp;ev=p14:table3</text>
    <text class="h" x="632" y="190">Answer citation</text>
    <text class="s" x="632" y="210">03 · MODEL CHOOSES</text>
  </g>

  <path d="M858 141H888" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M882 135L890 141L882 147" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#s)">
    <rect x="898" y="58" width="266" height="166" rx="14" fill="url(#paper)" stroke="#e2e8f0"/>
    <rect x="922" y="76" width="104" height="112" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="934" y="90" width="80" height="5" rx="2.5" fill="#94a3b8" opacity=".45"/>
    <rect x="934" y="102" width="58" height="5" rx="2.5" fill="#94a3b8" opacity=".35"/>
    <rect x="934" y="126" width="80" height="32" rx="3" fill="#fee2e2" stroke="#e11d48" stroke-width="2"/>
    <rect x="940" y="135" width="44" height="4" rx="2" fill="#e11d48" opacity=".7"/>
    <text class="h" x="1044" y="102">Reader</text>
    <text class="t" x="1044" y="124">jump to page</text>
    <text class="t" x="1044" y="142">draw the box</text>
    <text class="t" x="1044" y="160">stay aligned on zoom</text>
    <text class="s" x="922" y="210">04 · PLUGIN RESOLVES</text>
  </g>

  <text class="tiny" x="36" y="272">The model does not calculate coordinates. It picks the evidence; the plugin resolves the box.</text>
</svg>

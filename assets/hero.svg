<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Paper Evidence Reader: every claim, back to the page">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101d31"/>
      <stop offset="1" stop-color="#13263a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .eyebrow { font: 600 13px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 2.2px; fill: #5eead4; }
      .title { font: 700 44px/1.1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 20px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .meta { font: 500 13px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; letter-spacing: .2px; }
      .cardLabel { font: 600 12px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .tiny { font: 500 11px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; }
      .mono { font: 500 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; fill: #5eead4; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <g transform="translate(64 66)">
    <text class="eyebrow" x="0" y="0">DEEPSEEK HARNESS PLUGIN</text>
    <text class="title" x="0" y="58">Paper Evidence Reader</text>
    <text class="subtitle" x="0" y="98">Every claim, back to the page.</text>
    <text class="meta" x="0" y="144">行级原文 · OCR 标签 · 整张表 · 整幅图 · 可展开查证过程</text>
    <rect x="0" y="174" width="252" height="34" rx="17" fill="#0f2a2a" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text class="mono" x="16" y="196">page + bbox + evidence id</text>
    <text class="tiny" x="278" y="196">click → jump → box</text>
  </g>

  <g transform="translate(704 52)" filter="url(#shadow)">
    <rect x="0" y="0" width="432" height="216" rx="18" fill="#0b1524" stroke="#ffffff" stroke-opacity="0.12"/>
    <text class="cardLabel" x="20" y="30">PDF</text>
    <rect x="20" y="44" width="92" height="128" rx="6" fill="#f8fafc" fill-opacity="0.96"/>
    <rect x="30" y="58" width="72" height="6" rx="3" fill="#94a3b8" fill-opacity="0.5"/>
    <rect x="30" y="72" width="54" height="6" rx="3" fill="#94a3b8" fill-opacity="0.35"/>
    <rect x="30" y="86" width="68" height="6" rx="3" fill="#94a3b8" fill-opacity="0.35"/>
    <rect x="30" y="112" width="72" height="36" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <rect x="36" y="120" width="40" height="5" rx="2" fill="#ef4444" fill-opacity="0.7"/>
    <rect x="36" y="132" width="55" height="5" rx="2" fill="#ef4444" fill-opacity="0.45"/>

    <path d="M126 108H156" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
    <path d="M150 102L158 108L150 114" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="170" y="52" width="238" height="112" rx="12" fill="#0d2230" stroke="#5eead4" stroke-opacity="0.45"/>
    <text class="tiny" x="186" y="76">EVIDENCE INDEX</text>
    <text class="mono" x="186" y="100">p14 · table3</text>
    <text class="tiny" x="186" y="122">caption + rows + bbox</text>
    <rect x="186" y="136" width="184" height="5" rx="2" fill="#5eead4" fill-opacity="0.6"/>
    <rect x="186" y="146" width="126" height="5" rx="2" fill="#5eead4" fill-opacity="0.3"/>

    <path d="M170 176V196H20" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.6"/>
    <text class="tiny" x="186" y="192">reader draws the box at zoom</text>
  </g>
</svg>
